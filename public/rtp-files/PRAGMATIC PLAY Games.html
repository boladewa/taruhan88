        /* =========================================================
           RESET
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050b14;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================================
           MOBILE HEADER
        ========================================================= */
        .mobile-header-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #071326;
            border-bottom: 1px solid #14284a;
            padding: 0 15px;
            align-items: center;
            justify-content: space-between;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }

        .mobile-menu-btn {
            background: #007bff;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .mobile-active-provider-logo {
            width: 155px;
            height: 44px;
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 5px;
        }

        .mobile-active-provider-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(1.3) contrast(1.15);
        }

        /* =========================================================
           SIDEBAR OVERLAY
        ========================================================= */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */
        .sidebar {
            width: 300px;
            height: 100vh;
            flex-shrink: 0;
            position: sticky;
            top: 0;

            background: #071326;
            border-right: 1px solid #14284a;

            display: flex;
            flex-direction: column;

            z-index: 1000;
            transition: transform .3s ease;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid #14284a;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: bold;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: 0;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        /* =========================================================
           PROVIDER GRID
        ========================================================= */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;

            padding: 15px;

            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }

        .provider-card {
            height: 45px;
            padding: 0;

            background: #112238;
            border: 1px solid #1b3866;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;

            transition: .2s ease;
        }

        .provider-card:hover {
            border-color: #3b82f6;
            background: #102547;
        }

        .provider-card.active {
            background: #007bff;
            border-color: #60a5fa;
            box-shadow: 0 0 8px rgba(0, 123, 255, .4);
        }

        .provider-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */
        .main-content {
            flex: 1;
            min-width: 0;

            padding: 25px;

            background: #050b14;
            overflow-y: auto;
        }

        .content-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* =========================================================
           GAME GRID
        ========================================================= */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .game-card {
            background: #0b1a32;
            border: 1px solid #14284a;
            border-radius: 10px;
            overflow: hidden;

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease;

            text-align: center;

            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
        }

        /* =========================================================
           GAME IMAGE
        ========================================================= */
        .game-img {
            position: relative;
            width: 100%;
            height: 130px;

            background: #112238;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .game-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================================================
           HOT BADGE
        ========================================================= */
        .hot-badge {
            display: none;

            position: absolute;
            top: 0;
            left: 0;

            padding: 3px 8px;

            background: linear-gradient(
                135deg,
                #b91c1c,
                #ef4444
            );

            color: #fff;
            font-size: 9px;
            font-weight: bold;

            border-bottom-right-radius: 8px;

            text-transform: uppercase;
            letter-spacing: .5px;

            z-index: 2;
        }

        .game-card.is-hot .hot-badge {
            display: block;
        }

        /* =========================================================
           POLA BUTTON
        ========================================================= */
        .pola-btn {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) scale(.9);

            background: linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color: #fff;

            font-size: 11px;
            font-weight: bold;

            padding: 6px 14px;

            border: 1px solid #60a5fa;
            border-radius: 6px;

            cursor: pointer;

            opacity: 0;
            visibility: hidden;

            transition: .25s ease;

            z-index: 3;
        }

        .game-img:hover .pola-btn {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================================
           GAME INFO
        ========================================================= */
        .game-info {
            padding: 10px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .game-title-row {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 6px;
        }

        .game-icon {
            width: 22px;
            height: 22px;

            border-radius: 50%;
            object-fit: cover;

            flex-shrink: 0;
        }

        .game-title {
            flex: 1;

            font-size: 11px;
            font-weight: bold;

            text-align: left;
            line-height: 1.2;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        /* =========================================================
           RTP BAR
        ========================================================= */
        @keyframes moveStripes {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 40px 0;
            }
        }

        .game-rtp {
            position: relative;

            width: 100%;

            padding: 5px;

            border-radius: 4px;

            color: #fff;
            font-size: 12px;
            font-weight: bold;

            text-align: center;

            overflow: hidden;
        }

        .game-rtp::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, .22) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, .22) 50%,
                rgba(255, 255, 255, .22) 75%,
                transparent 75%,
                transparent
            );

            background-size: 40px 40px;

            animation:
                moveStripes 1.5s linear infinite;

            z-index: 0;
        }

        .game-rtp span {
            position: relative;
            z-index: 2;
        }

        /* =========================================================
           MODAL
        ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .75);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            opacity: 0;
            visibility: hidden;

            transition: .3s ease;

            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            width: 100%;
            max-width: 380px;

            background: #1a2233;

            border: 1px solid #2d3748;
            border-radius: 14px;

            padding: 15px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .6);

            transform: scale(.8);

            transition:
                transform .3s
                cubic-bezier(
                    .175,
                    .885,
                    .32,
                    1.275
                );
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            background: #111827;

            padding: 10px 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #27303f;
            border-radius: 8px;

            margin-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 15px;
            font-weight: bold;

            color: #fff;

            text-transform: uppercase;
        }

        .modal-close {
            background: none;
            border: 0;

            color: #9ca3af;

            font-size: 18px;

            cursor: pointer;
        }

        .modal-info-box {
            background: #111827;

            border-radius: 8px;

            padding: 8px 12px;

            margin-bottom: 10px;

            font-size: 12px;

            border: 1px solid #263142;
        }

        .info-row {
            display: flex;
            justify-content: space-between;

            padding: 4px 0;
        }

        .info-row span:last-child {
            font-weight: bold;
            color: #e2e8f0;
        }

        .pola-gacor-btn-title {

                #65a30d,
                #4d7c0f
            );

            color: #fff;

            text-align: center;

            font-weight: bold;

            padding: 8px;

            border-radius: 8px;

            font-size: 13px;

            text-transform: uppercase;
            letter-spacing: 1px;

            margin-bottom: 10px;

            border: 1px solid #65a30d;
        }

        .pola-steps-card {
            background: #111827;

            border-radius: 10px;

            padding: 12px;

            border: 1px solid #263142;

            text-align: center;

            margin-bottom: 10px;

            max-height: 200px;

            overflow-y: auto;
        }

        .step-item {
            margin-bottom: 10px;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-label {
            font-size: 12px;
            color: #94a3b8;

            margin-bottom: 3px;
        }

        .step-action {
            font-size: 13px;
            font-weight: bold;

            color: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;
        }

        .check {
            color: #27ae60;
        }

        .cross {
            color: #ef4444;
        }

        .modal-footer-note {
            font-size: 11px;

            color: #94a3b8;

            line-height: 1.4;
        }

        /* =========================================================
           MOBILE
        ========================================================= */
        @media (max-width: 768px) {

            .mobile-header-bar {

                left: 0;

                transform: translateX(-100%);

                z-index: 1002;

            }

            .close-sidebar {

            }

            .main-content {

                    20px
                    15px;
            }

            .games-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .pola-btn {
                opacity: 1;
                visibility: visible;

                transform:
                    translate(-50%, -50%)
                    scale(.85);

                padding: 5px 10px;

                font-size: 10px;
            }

        /* =========================================================
           RTP + POLA SYSTEM
           1 periode = 35 menit = 1 paket RTP + 1 paket pola.
           Refresh tidak membuat paket baru.
        ========================================================== */

        const RTP_TIMESTAMP_KEY = "pragmatic_rtp_timestamp";
        const RTP_DATA_KEY = "pragmatic_rtp_game_data";
        const RTP_PACKAGE_KEY = "pragmatic_rtp_pola_package";
        const RTP_INTERVAL = 35 * 60 * 1000;

        function getPeriodIndex() {
            return Math.floor(Date.now() / RTP_INTERVAL);
        }

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function hashString(value) {
            let hash = 0;
            for (let i = 0; i < value.length; i++) {
                hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
            }
            return Math.abs(hash) + 1;
        }

        function getPackageForGame(game, periodIndex) {
            const seed = hashString(String(periodIndex) + "|" + game.id + "|" + game.name);
            const rand = n => seededRandom(seed + n);

            /*
             * Pola di bawah adalah DATA SIMULASI tampilan.
             * Setiap periode 35 menit mendapat satu paket yang stabil.
             * Jumlah spin diacak dari pilihan:
             *   - Manual : 1 - 30
             *   - Auto   : 10, 20, 30, 50, 70, 100
             * Ikon hanya menggunakan kombinasi yang ditentukan.
             */
            const actionTypes = ["Manual Spin", "Auto Spin", "Manual Spin", "Auto Spin"];
            const autoSpinOptions = [10, 20, 30, 50, 70, 100];
            const iconPatterns = [
                ["cross", "cross", "check"],
                ["cross", "check", "cross"],
                ["check", "cross", "check"],
                ["cross", "cross", "check"],
                ["cross", "check", "check"],
                ["check", "cross", "cross"],
                ["cross", "cross", "cross"]
            ];
            const stakeRanges = [
                "200 - 5.0k", "400 - 8.5k", "800 - 9.8k",
                "1.000 - 15.0k", "200 - 20.0k"
            ];

            const rtp = Math.floor(rand(1) * 84) + 15;

            const makeIconHTML = (pattern) => pattern.map(type => type === "check"
                ? '<span class="check">✔</span>'
                : '<span class="cross">✖</span>'
            ).join("");

            /* 5 langkah: tipe, jumlah spin, dan pola ikon semuanya
               berasal dari seed periode + game, sehingga refresh tetap sama. */
            const steps = Array.from({ length: 5 }, (_, index) => {
                const type = actionTypes[Math.floor(rand(10 + index * 3) * actionTypes.length)];
                const isManual = type.startsWith("Manual");
                const count = isManual
                    ? 1 + Math.floor(rand(11 + index * 3) * 30)
                    : autoSpinOptions[
                        Math.floor(
                            rand(12 + index * 3) * autoSpinOptions.length
                        )
                    ];
                const pattern = iconPatterns[Math.floor(rand(13 + index * 3) * iconPatterns.length)];
                return {
                    type,
                    count,
                    pattern,
                    iconHTML: makeIconHTML(pattern)
                };
            });

            /* Jam juga dibuat dari seed periode, sehingga refresh
               tidak mengubah paket selama masih di periode yang sama. */
            const start = Math.floor(rand(6) * 1440);
            const duration = 15 + Math.floor(rand(7) * 30);
            const end = (start + duration) % 1440;
            const fmt = total => {
                const h = Math.floor(total / 60) % 24;
                const m = total % 60;
                return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
            };

            return {
                rtp,
                stake: stakeRanges[Math.floor(rand(30) * stakeRanges.length)],
                jam: fmt(start) + " - " + fmt(end),
                steps
            };
        }

        function getPeriodStart() {
            return getPeriodIndex() * RTP_INTERVAL;
        }

        function getNextUpdate() {
            return (getPeriodIndex() + 1) * RTP_INTERVAL;
        }

        function formatPackageTime(timestamp) {
            const d = new Date(timestamp);
            return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        }

        function generateRTP() {
            const periodIndex = getPeriodIndex();
            const timestamp = periodIndex * RTP_INTERVAL;
            const data = {};
            const packageData = {};

            games.forEach(game => {
                const pack = getPackageForGame(game, periodIndex);
                data[game.id] = pack.rtp;
                packageData[game.id] = pack;
            });

            localStorage.setItem(RTP_TIMESTAMP_KEY, String(timestamp));
            localStorage.setItem(RTP_DATA_KEY, JSON.stringify(data));
            localStorage.setItem(RTP_PACKAGE_KEY, JSON.stringify({ periodIndex, data: packageData }));

            document.querySelectorAll(".game-card").forEach(card => {
                const gameId = card.dataset.gameId;
                const rtp = data[gameId] || 50;
                const rtpElement = card.querySelector(".game-rtp");
                const rtpText = rtpElement.querySelector("span");
                rtpText.innerText = rtp + "%";

                let color;
                if (rtp <= 35) color = "#e74c3c";
                else if (rtp <= 74) color = "#f1c40f";
                else color = "#27ae60";

                if (rtp >= 75) card.classList.add("is-hot");
                else card.classList.remove("is-hot");

                rtpElement.style.background = `linear-gradient(90deg, ${color} ${rtp}%, #111827 ${rtp}%)`;
                rtpElement.style.border = `1px solid ${color}`;
            });
        }

        /* =========================================================
           RANDOM TIME
        ========================================================== */

        function generateRandomTime() {

            const now =
                new Date();

            const startHour =
                now.getHours();

            const startMinute =
                now.getMinutes();

            const duration =
                15 +
                Math.floor(
                    Math.random() * 30
                );


            let endMinute =
                startMinute + duration;

            let endHour =
                startHour;


            if (endMinute >= 60) {

                endMinute -= 60;

                endHour =
                    (startHour + 1) % 24;

            }


            const format =
                (hour, minute) => {

                    return (
                        String(hour).padStart(2, "0")
                        +
                        ":"
                        +
                        String(minute).padStart(2, "0")
                    );

                };


            return (
                format(
                    startHour,
                    startMinute
                )
                +
                " - "
                +
                format(
                    endHour,
                    endMinute
                )
            );

        }

        ========================================================== */

        function openPolaModal(gameName) {
            const game = games.find(item => item.name === gameName);
            if (!game) return;

            const periodIndex = getPeriodIndex();
            const pack = getPackageForGame(game, periodIndex);

            document.getElementById("modalGameTitle").innerText = gameName.toUpperCase();
            document.getElementById("modalStake").innerText = pack.stake;
            document.getElementById("modalJam").innerText = pack.jam;
            document.getElementById("polaSectionTitle").innerText = "Pola Gacor";

            const stepLabels = [
                "Panaskan Mesin !",
                "Naikkan Bet !",
                "Putaran Berikutnya !",
                "Putaran Turbo !",
                "Putaran akhir !"
            ];

            document.getElementById("modalContentCard").innerHTML = pack.steps.map((step, index) => `
                <div class="step-item">
                    <div class="step-label">${stepLabels[index]}</div>
                    <div class="step-action">${step.type} ${step.count}x ${step.iconHTML}</div>
                </div>
            `).join("");

            document.getElementById("modalFooterNote").innerHTML =
                "Catatan :<br>Ini hanya simulasi tampilan/demo." +
                "<br>Periode: " + formatPackageTime(getPeriodStart()) +
                " - " + formatPackageTime(getNextUpdate());

            document.getElementById("polaModal").classList.add("active");
        }


        /* =========================================================
           SPACEMAN MODAL
        ========================================================== */

        function openSpacemanModal(gameName) {

            document
                .getElementById("modalGameTitle")
                .innerText =
                gameName.toUpperCase();


            document
                .getElementById("modalStake")
                .innerText =
                getRandomItem(stakeRanges);


            const now =
                new Date();

            let currentHour =
                now.getHours();

            let currentMinute =
                now.getMinutes();


            document
                .getElementById("modalJam")
                .innerText =
                String(currentHour).padStart(2, "0")
                +
                ":"
                +
                String(currentMinute).padStart(2, "0")
                +
                " (Live Real-Time)";


            document
                .getElementById("polaSectionTitle")
                .innerText =
                "JAM TERBANG TINGGI 🚀";


            let html = "";


            for (
                let i = 0;
                i < 7;
                i++
            ) {

                let minute =
                    currentMinute - (i * 2);

                let hour =
                    currentHour;


                while (minute < 0) {

                    minute += 60;

                    hour =
                        (hour - 1 + 24) % 24;

                }


                const time =
                    String(hour).padStart(2, "0")
                    +
                    ":"
                    +
                    String(minute).padStart(2, "0");


                const multiplier =
                    getRandomItem(
                        multiplierOptions
                    );


                const icon =
                    Math.random() > .3
                        ? `<span class="check">✔</span>`
                        : `<span class="cross">✖</span>`;


                html += `

                    <div
                        class="step-item"
                        style="
                            display:flex;
                            justify-content:space-between;
                            padding:4px 0;
                            border-bottom:1px solid rgba(255,255,255,.05);
                            font-size:12px;

                            ${icon}
                            <strong style="color:#fff;">
                                ${multiplier}
                            </strong>
                            ==>up
                        </span>

                    </div>

            }


            document
                .getElementById("modalContentCard")
                .innerHTML =
                html;


            document
                .getElementById("modalFooterNote")

                "Catatan :<br>Tekan cashout tepat waktu sesuai target jam terbang di atas!";


            document
                .getElementById("polaModal")

                event.target !==
                document.getElementById("polaModal")
            ) {
                return;
            }

            document
                .getElementById("polaModal")
                .classList.remove("active");

        }


        function forceCloseModal() {

            document
                .getElementById("polaModal")
                .classList.remove("active");

        }


        /* =========================================================
           INIT
        ========================================================== */

        let lastRtpPeriod = getPeriodIndex();

        document.addEventListener(
            "DOMContentLoaded",
            () => {
                renderProviders();
                renderGames();
                generateRTP();
            }
        );

        setInterval(() => {
            const currentPeriod = getPeriodIndex();

            if (currentPeriod !== lastRtpPeriod) {
                lastRtpPeriod = currentPeriod;
                generateRTP();

                const modal = document.getElementById("polaModal");
                if (modal && modal.classList.contains("active")) {
                    modal.classList.remove("active");
                }
            }
        }, 1000);
    </script>

</body>
</html>
