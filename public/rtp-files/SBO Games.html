<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBO Games - Daftar Game & Providers</title>

    <!-- LOGO / FAVICON -->
    <link rel="icon" type="image/png" href="https://img-1-97.rapidflarecdn.net/images/providerCategory/SBOGames/colorful-light-landscape.png?lang=en">
    <link rel="shortcut icon" type="image/png" href="https://img-1-97.rapidflarecdn.net/images/providerCategory/SBOGames/colorful-light-landscape.png?lang=en">

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050b14;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================================
           MOBILE HEADER
        ========================================================= */

        .mobile-header-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #071326;
            border-bottom: 1px solid #14284a;
            padding: 0 15px;
            align-items: center;
            justify-content: space-between;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }

        .mobile-menu-btn {
            background: #007bff;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .mobile-active-provider-logo {
            width: 155px;
            height: 44px;
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 5px;
        }

        .mobile-active-provider-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(1.3) contrast(1.15);
        }

        /* =========================================================
           SIDEBAR OVERLAY
        ========================================================= */

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            width: 300px;
            height: 100vh;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: #071326;
            border-right: 1px solid #14284a;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform .3s ease;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid #14284a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: bold;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: 0;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        /* =========================================================
           PROVIDER GRID
        ========================================================= */

        .providers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }

        .provider-card {
            height: 45px;
            background: #112238;
            border: 1px solid #1b3866;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: .2s ease;
        }

        .provider-card:hover {
            border-color: #3b82f6;
            background: #102547;
        }

        .provider-card.active {
            background: #007bff;
            border-color: #60a5fa;
            box-shadow: 0 0 8px rgba(0, 123, 255, .4);
        }

        .provider-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 25px;
            background: #050b14;
            overflow-y: auto;
        }

        .content-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* =========================================================
           GAME GRID
        ========================================================= */

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .game-card {
            background: #0b1a32;
            border: 1px solid #14284a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition:
                transform .2s ease,
                border-color .2s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
        }

        /* =========================================================
           GAME IMAGE
        ========================================================= */

        .game-img {
            position: relative;
            width: 100%;
            height: 130px;
            background: #112238;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-img img.game-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================================================
           BADGE
        ========================================================= */

        .hot-badge {
            position: absolute;
            top: 0;
            left: 0;
            padding: 3px 8px;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            border-bottom-right-radius: 8px;
            text-transform: uppercase;
            letter-spacing: .5px;
            z-index: 5;
        }

        .hot-badge.exclusive {
            background: linear-gradient(135deg, #0759c9, #1683ff);
            box-shadow: 0 2px 7px rgba(0, 100, 255, .35);
        }

        .hot-badge.new {
            background: linear-gradient(135deg, #c91d2e, #ff3347);
            box-shadow: 0 2px 7px rgba(255, 0, 40, .35);
        }

        /* =========================================================
           POLA BUTTON
        ========================================================= */

        .pola-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.9);
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 5px 13px;
            border-radius: 5px;
            border: 1px solid #60a5fa;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all .25s ease;
            z-index: 10;
        }

        .game-img:hover .pola-btn {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================================
           GAME INFO
        ========================================================= */

        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-title-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: contain;
            flex-shrink: 0;
        }

        .game-title {
            flex: 1;
            font-size: 11px;
            font-weight: bold;
            text-align: left;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* =========================================================
           RTP BAR
        ========================================================= */

        .game-rtp-bar-container {
            position: relative;
            width: 100%;
            height: 19px;
            background: #1a2c4e;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================================
           RTP FILL
        ========================================================= */

        .game-rtp-fill {
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 100%;
            border-radius: 4px 0 0 4px;
            overflow: hidden;

            transition:
                width .5s ease,
                background .3s ease;

            transform: translateZ(0);
            will-change: width;
        }

        /* =========================================================
           DIAGONAL ANIMATION
           
           INI BAGIAN UTAMA YANG DIUBAH.

           Garis diagonal dibuat lebih besar dan jelas,
           seperti gambar kedua yang kamu kirim.
        ========================================================= */

        .game-rtp-fill::after {
            content: "";
            position: absolute;
            inset: 0;

            /*
             * Pola diagonal besar:
             * - bagian terang
             * - bagian transparan
             * - bagian gelap
             *
             * Semuanya dibuat miring 135deg.
             */
            background: repeating-linear-gradient(
                135deg,
                rgba(255, 255, 255, .22) 0px,
                rgba(255, 255, 255, .22) 14px,

                rgba(255, 255, 255, .05) 14px,
                rgba(255, 255, 255, .05) 22px,

                rgba(0, 0, 0, .14) 22px,
                rgba(0, 0, 0, .14) 34px,

                rgba(0, 0, 0, 0) 34px,
                rgba(0, 0, 0, 0) 44px
            );

            /*
             * Ukuran tile dibuat tetap agar looping
             * tidak terlihat patah.
             */
            background-size: 44px 44px;

            /*
             * Gerakan diagonal horizontal.
             */
            background-position: 0 0;

            animation:
                rtpDiagonalMove .9s linear infinite;

            will-change: background-position;
            transform: translateZ(0);
            pointer-events: none;
        }

        /* =========================================================
           RTP DIAGONAL KEYFRAME
        ========================================================= */

        @keyframes rtpDiagonalMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: -44px 0;
            }
        }

        /* =========================================================
           RTP TEXT
        ========================================================= */

        .game-rtp-text {
            position: relative;
            z-index: 3;
            font-size: 9px;
            color: #fff;
            font-weight: bold;

            text-shadow:
                0 1px 2px rgba(0, 0, 0, .8);

            pointer-events: none;
        }

        /* =========================================================
           DEMO LABEL
        ========================================================= */

        .demo-label {
            font-size: 8px;
            color: #64748b;
            text-align: center;
            margin-top: -3px;
        }

        /* =========================================================
           MODAL
        ========================================================= */

        .pola-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .78);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .pola-modal-overlay.active {
            display: flex;
        }

        .pola-modal-box {
            background: #0b172a;
            border: 1px solid #1e3a6e;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .9);
            animation: modalScaleUp .25s ease;
        }

        @keyframes modalScaleUp {
            from {
                transform: scale(.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* =========================================================
           MODAL HEADER
        ========================================================= */

        .pola-modal-header {
            background: #081120;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #14284a;
        }

        .pola-modal-title {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .pola-close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }

        /* =========================================================
           MODAL BODY
        ========================================================= */

        .pola-modal-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* =========================================================
           INFO BOX
        ========================================================= */

        .pola-info-box {
            background: #07101f;
            border: 1px solid #162c4e;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 11px;
        }

        .pola-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .pola-info-label {
            color: #cbd5e1;
            font-weight: bold;
        }

        .pola-info-value {
            color: #fff;
            font-weight: bold;
            text-align: right;
        }

        /* =========================================================
           ACTION HEADER
        ========================================================= */

        .pola-action-btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* =========================================================
           POLA BOX
        ========================================================= */

        .pola-pattern-box {
            background: #07101f;
            border: 1px solid #162c4e;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }

        .pola-pattern-title {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .pola-pattern-value {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.7;
        }

        /* =========================================================
           POLA STEP
        ========================================================= */

        .pattern-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step-item {
            background: #0b1a32;
            border: 1px solid #1b3866;
            border-radius: 7px;
            padding: 9px 10px;
            text-align: left;
        }

        .step-label {
            color: #94a3b8;
            font-size: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .step-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            font-weight: bold;
            flex-wrap: wrap;
        }

        .check {
            color: #22c55e;
            font-size: 16px;
            font-weight: bold;
        }

        .cross {
            color: #ef4444;
            font-size: 16px;
            font-weight: bold;
        }

        /* =========================================================
           NOTE
        ========================================================= */

        .pola-note {
            color: #94a3b8;
            font-size: 10px;
            line-height: 1.5;
            background: #07101f;
            border: 1px solid #162c4e;
            border-radius: 7px;
            padding: 9px;
        }

        /* =========================================================
           NEXT UPDATE
        ========================================================= */

        .next-update {
            text-align: center;
            font-size: 9px;
            color: #64748b;
            padding-top: 2px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {

            .mobile-header-bar {
                display: flex;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 300px;
                height: 100vh;
                transform: translateX(-100%);
                z-index: 1002;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                padding: 75px 15px 20px 15px;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .pola-btn {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, -50%) scale(.95);
            }

            .pola-modal-box {
                max-width: 380px;
            }
        }

        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (max-width: 380px) {

            .sidebar {
                width: 300px;
            }

            .mobile-active-provider-logo {
                width: 145px;
            }

            .game-img {
                height: 125px;
            }

            .game-title {
                font-size: 10px;
            }

            .game-rtp-text {
                font-size: 8px;
            }

            .step-action {
                gap: 5px;
            }
        }
    
        /* =========================================================
           PRAGMATIC-STYLE POLA MODAL
        ========================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: .3s ease;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            width: 100%;
            max-width: 380px;
            background: #1a2233;
            border: 1px solid #2d3748;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .6);
            transform: scale(.8);
            transition: transform .3s cubic-bezier(.175, .885, .32, 1.275);
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            background: #111827;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #27303f;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: 0;
            color: #9ca3af;
            font-size: 18px;
            cursor: pointer;
        }

        .modal-info-box {
            background: #111827;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            border: 1px solid #263142;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .info-row span:last-child {
            font-weight: bold;
            color: #e2e8f0;
        }

        .pola-gacor-btn-title {
            background: linear-gradient(180deg, #65a30d, #4d7c0f);
            color: #fff;
            text-align: center;
            font-weight: bold;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border: 1px solid #65a30d;
        }

        .pola-steps-card {
            background: #111827;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #263142;
            text-align: center;
            margin-bottom: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .pola-steps-card .step-item {
            margin-bottom: 10px;
        }

        .pola-steps-card .step-item:last-child {
            margin-bottom: 0;
        }

        .pola-steps-card .step-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 3px;
        }

        .pola-steps-card .step-action {
            font-size: 13px;
            font-weight: bold;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .pola-steps-card .check { color: #27ae60; }
        .pola-steps-card .cross { color: #ef4444; }

        .modal-footer-note {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.4;
        }

        @media (max-width: 380px) {
            .modal-container { max-width: 360px; }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         MOBILE HEADER
    ========================================================= -->

    <div class="mobile-header-bar">

        <button
            class="mobile-menu-btn"
            onclick="toggleSidebar()"
        >
            ☰ Providers
        </button>

        <div class="mobile-active-provider-logo">

            <img
                src="https://img-1-97.rapidflarecdn.net/images/providerCategory/SBOGames/colorful-light-landscape.png?lang=en"
                alt="SBO"
            >

        </div>

    </div>


    <!-- =========================================================
         SIDEBAR OVERLAY
    ========================================================= -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="toggleSidebar()"
    ></div>


    <!-- =========================================================
         SIDEBAR
    ========================================================= -->

    <aside
        class="sidebar"
        id="sidebarMenu"
    >

        <div class="sidebar-header">

            <h3>Providers</h3>

            <button
                class="close-sidebar"
                onclick="toggleSidebar()"
            >
                &times;
            </button>

        </div>

        <div
            class="providers-grid"
            id="providersGrid"
        ></div>

    </aside>


    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main class="main-content">

        <div
            class="content-header"
            id="contentTitle"
        >
            SBO Games
        </div>

        <div
            class="games-grid"
            id="gamesContainer"
        ></div>

    </main>


    <!-- =========================================================
         MODAL POLA
    ========================================================== -->

    <div
        class="modal-overlay"
        id="polaModal"
        onclick="closePolaModal(event)"
    >

        <div
            class="modal-container"
            onclick="event.stopPropagation()"
        >

            <div class="modal-header">

                <h2 id="modalGameTitle">
                    GAME
                </h2>

                <button
                    class="modal-close"
                    onclick="forceCloseModal()"
                >
                    &times;
                </button>

            </div>

            <div class="modal-body">

                <div class="modal-info-box">

                    <div class="info-row">
                        <span>Stake bet :</span>
                        <span id="modalStake">
                            400 - 8.5k
                        </span>
                    </div>

                    <div class="info-row">
                        <span>Jam Gacor :</span>
                        <span id="modalJam">
                            05:31 - 07:51
                        </span>
                    </div>

                </div>

                <div
                    class="pola-gacor-btn-title"
                    id="polaSectionTitle"
                >
                    Pola Gacor
                </div>

                <div
                    class="pola-steps-card"
                    id="modalContentCard"
                >
                    <div class="step-item">
                        <div class="step-label">
                            Panaskan Mesin !
                        </div>
                        <div class="step-action">
                            20
                            <span class="check">✔</span>
                            <span class="cross">✖</span>
                            <span class="cross">✖</span>
                            Auto
                        </div>
                    </div>

                    <div class="step-item">
                        <div class="step-label">
                            Naikkan Bet !
                        </div>
                        <div class="step-action">
                            10
                            <span class="cross">✖</span>
                            <span class="cross">✖</span>

            const x =

            return x - Math.floor(x);

                    gameIndex * 17

            return 1 + random * 99;

        }

                    type: "red"

            }

            if (rtp <= 69) {

                    background:
                        "linear-gradient(90deg, #eab308, #facc15)",
                    type: "yellow"
                };

            }

            return {
                background:
                    "linear-gradient(90deg, #15803d, #22c55e)",
                type: "green"
            };

        }

            const cards =
                document.querySelectorAll(
                    ".game-card"
                );

            cards.forEach(
                (card, index) => {

                    const rtp =
                        getSimulatedRtp(index);

                    const fill =
                        card.querySelector(
                            ".game-rtp-fill"
                        );

                    const text =
                        card.querySelector(
                            ".game-rtp-text"
                        );

                    if (!fill || !text) {
                        return;
                    }

                    const rounded =
                        Math.round(rtp);

                    const color =
                        getRtpColor(rounded);

                    const width =
                        Math.min(
                            100,
                            Math.max(
                                1,
                                rounded
                            )
                        );

                    /*
                     * Nilai RTP menentukan panjang bar.
                     */
                    fill.style.width =
                        width + "%";

                    /*
                     * Warna dasar bar.
                     */
                    fill.style.background =
                        color.background;

                    /*
                     * Teks persentase.
                     */
                    text.textContent =
                        rounded + "%";

                }
            );

        }

                "1.000 - 15.0k"
            ];

            const period = getPeriodIndex();
            const index = Math.floor(
                seededRandom(period * 701 + gameIndex * 13) * options.length
            );

            return options[index];

        }


        function getPopupJam(gameIndex) {

            const period = getPeriodIndex();
            const seed = period * 1703 + gameIndex * 29;
            const startMinutes = Math.floor(
                seededRandom(seed) * 1440
            );
            const duration = 15 + Math.floor(
                seededRandom(seed + 1) * 30
            );

            const endMinutes =
                (startMinutes + duration) % 1440;

            const format = minutes => {
                const hour = Math.floor(minutes / 60);
                const minute = minutes % 60;
                return String(hour).padStart(2, "0") + ":" +
                    String(minute).padStart(2, "0");
            };

            return format(startMinutes) + " - " + format(endMinutes);

        }


        function openPolaModal(game, gameIndex) {

            document
                .getElementById("modalGameTitle")
                .innerText =
                game.name.toUpperCase();

            document
                .getElementById("modalStake")
                .innerText =
                getPopupStake(gameIndex);

            document
                .getElementById("modalJam")
                .innerText =
                getPopupJam(gameIndex);

            document
                .getElementById("polaSectionTitle")
                .innerText =
                "Pola Gacor";

            document
                .getElementById("modalContentCard")
                .innerHTML =
                getSimulatedPattern(gameIndex);

            document
                .getElementById("modalFooterNote")
                .innerHTML =
                "Catatan :<br>lakukan pola di atas minimal 2x!";

            document
                .getElementById("polaModal")
                .classList.add("active");

        }


        function forceCloseModal() {

            document
                .getElementById("polaModal")
                .classList.remove("active");

        }


        function closePolaModal(event) {

            if (
                event &&
                event.target !==
                document.getElementById("polaModal")
            ) {
                return;
            }

            forceCloseModal();

        }


        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {
                    forceCloseModal();
                }

            }
        );


        /* =========================================================
           MOBILE SIDEBAR
        ========================================================= */

        function toggleSidebar() {

            sidebar.classList.toggle(
                "active"
            );

            overlay.classList.toggle(
                "active"
            );

        }


        /* =========================================================
           AUTO UPDATE 35 MENIT
        ========================================================= */

        let lastPeriod =
            getPeriodIndex();


        setInterval(
            () => {

                const currentPeriod =
                    getPeriodIndex();

                if (
                    currentPeriod !==
                    lastPeriod
                ) {

                    lastPeriod =
                        currentPeriod;

                    updateRtpValues();

                }

            },
            1000
        );


        /* =========================================================
           INIT
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                renderProviders();
                renderGames();

            }
        );

    </script>

</body>

</html>
