                /* =========================================================
           RESET
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050b14;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================================
           MOBILE HEADER
        ========================================================= */
        .mobile-header-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #071326;
            border-bottom: 1px solid #14284a;
            padding: 0 15px;
            align-items: center;
            justify-content: space-between;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }

        .mobile-menu-btn {
            background: #007bff;
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .mobile-active-provider-logo {
            width: 155px;
            height: 44px;
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 5px;
        }

        .mobile-active-provider-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(1.3) contrast(1.15);
        }

        /* =========================================================
           SIDEBAR OVERLAY
        ========================================================= */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */
        .sidebar {
            width: 300px;
            height: 100vh;
            flex-shrink: 0;
            position: sticky;
            top: 0;

            background: #071326;
            border-right: 1px solid #14284a;

            display: flex;
            flex-direction: column;

            z-index: 1000;
            transition: transform .3s ease;
        }

        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid #14284a;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: bold;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: 0;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        /* =========================================================
           PROVIDER GRID
        ========================================================= */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;

            padding: 15px;

            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }

        .provider-card {
            height: 45px;
            padding: 0;

            background: #112238;
            border: 1px solid #1b3866;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            overflow: hidden;

            transition: .2s ease;
        }

        .provider-card:hover {
            border-color: #3b82f6;
            background: #102547;
        }

        .provider-card.active {
            background: #007bff;
            border-color: #60a5fa;
            box-shadow: 0 0 8px rgba(0, 123, 255, .4);
        }

        .provider-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
        }

        /* =========================================================
           MAIN CONTENT
        ========================================================= */
        .main-content {
            flex: 1;
            min-width: 0;

            padding: 25px;

            background: #050b14;
            overflow-y: auto;
        }

        .content-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* =========================================================
           GAME GRID
        ========================================================= */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .game-card {
            background: #0b1a32;
            border: 1px solid #14284a;
            border-radius: 10px;
            overflow: hidden;

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease;

            text-align: center;

            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
        }

        /* =========================================================
           GAME IMAGE
        ========================================================= */
        .game-img {
            position: relative;
            width: 100%;
            height: 130px;

            background: #112238;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .game-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================================================
           HOT BADGE
        ========================================================= */
        .hot-badge {
            display: none;

            position: absolute;
            top: 0;
            left: 0;

            padding: 3px 8px;

            background: linear-gradient(
                135deg,
                #b91c1c,
                #ef4444
            );

            color: #fff;
            font-size: 9px;
            font-weight: bold;

            border-bottom-right-radius: 8px;

            text-transform: uppercase;
            letter-spacing: .5px;

            z-index: 2;
        }

        .game-card.is-hot .hot-badge {
            display: block;
        }

        /* =========================================================
           POLA BUTTON
        ========================================================= */
        .pola-btn {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) scale(.9);

            background: linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color: #fff;

            font-size: 11px;
            font-weight: bold;

            padding: 6px 14px;

            border: 1px solid #60a5fa;
            border-radius: 6px;

            cursor: pointer;

            opacity: 0;
            visibility: hidden;

            transition: .25s ease;

            z-index: 3;
        }

        .game-img:hover .pola-btn {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================================================
           GAME INFO
        ========================================================= */
        .game-info {
            padding: 10px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .game-title-row {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 6px;
        }

        .game-icon {
            width: 22px;
            height: 22px;

            border-radius: 50%;
            object-fit: cover;

            flex-shrink: 0;
        }

        .game-title {
            flex: 1;

            font-size: 11px;
            font-weight: bold;

            text-align: left;
            line-height: 1.2;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        /* =========================================================
           RTP BAR
        ========================================================= */
        @keyframes moveStripes {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 40px 0;
            }
        }

        .game-rtp {
            position: relative;

            width: 100%;

            padding: 5px;

            border-radius: 4px;

            color: #fff;
            font-size: 12px;
            font-weight: bold;

            text-align: center;

            overflow: hidden;
        }

        .game-rtp::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, .22) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, .22) 50%,
                rgba(255, 255, 255, .22) 75%,
                transparent 75%,
                transparent
            );

            background-size: 40px 40px;

            animation:
                moveStripes 1.5s linear infinite;

            z-index: 0;
        }

        .game-rtp span {
            position: relative;
            z-index: 2;
        }

        /* =========================================================
           MODAL
        ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .75);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            opacity: 0;
            visibility: hidden;

            transition: .3s ease;

            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            width: 100%;
            max-width: 380px;

            background: #1a2233;

            border: 1px solid #2d3748;
            border-radius: 14px;

            padding: 15px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .6);

            transform: scale(.8);

            transition:
                transform .3s
                cubic-bezier(
                    .175,
                    .885,
                    .32,
                    1.275
                );
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            background: #111827;

            padding: 10px 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #27303f;
            border-radius: 8px;

            margin-bottom: 12px;
        }

        .modal-header h2 {
            font-size: 15px;
            font-weight: bold;

            color: #fff;

            text-transform: uppercase;
        }

        .modal-close {
            background: none;
            border: 0;

            color: #9ca3af;

            font-size: 18px;

            cursor: pointer;
        }

        .modal-info-box {
            background: #111827;

            border-radius: 8px;

            padding: 8px 12px;

            margin-bottom: 10px;

            font-size: 12px;

            border: 1px solid #263142;
        }

        .info-row {
            display: flex;
            justify-content: space-between;

            padding: 4px 0;
        }

        .info-row span:last-child {
            font-weight: bold;
            color: #e2e8f0;
        }

        .pola-gacor-btn-title {
            background: linear-gradient(
                180deg,
                #65a30d,
                #4d7c0f
            );

            color: #fff;

            text-align: center;

            font-weight: bold;

            padding: 8px;

            border-radius: 8px;

            font-size: 13px;

            text-transform: uppercase;
            letter-spacing: 1px;

            margin-bottom: 10px;

            border: 1px solid #65a30d;
        }

        .pola-steps-card {
            background: #111827;

            border-radius: 10px;

            padding: 12px;

            border: 1px solid #263142;

            text-align: center;

            margin-bottom: 10px;

            max-height: 200px;

            overflow-y: auto;
        }

        .step-item {
            margin-bottom: 10px;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-label {
            font-size: 12px;
            color: #94a3b8;

            margin-bottom: 3px;
        }

        .step-action {
            font-size: 13px;
            font-weight: bold;

            color: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;
        }

        .check {
            color: #27ae60;
        }

        .cross {
            color: #ef4444;
        }

        .modal-footer-note {
            font-size: 11px;

            color: #94a3b8;

            line-height: 1.4;
        }

        /* =========================================================
           MOBILE
        ========================================================= */
        @media (max-width: 768px) {

            .mobile-header-bar {
                display: flex;
            }

            .sidebar {
                position: fixed;

                top: 0;
                left: 0;

                transform: translateX(-100%);

                z-index: 1002;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                padding:

                    20px
                    15px;
            }

            .games-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .pola-btn {
                opacity: 1;
                visibility: visible;

                transform:
                    translate(-50%, -50%)
                    scale(.85);

                padding: 5px 10px;

                font-size: 10px;
            }
        }
    </style>
</head>

        const providersGrid =
            document.getElementById("providersGrid");

        const gamesContainer =
            document.getElementById("gamesContainer");

        const sidebar =
            document.getElementById("sidebarMenu");

        const overlay =
            document.getElementById("sidebarOverlay");


        /* =========================================================
           RENDER PROVIDERS
        ========================================================== */

        function renderProviders() {

            providersGrid.innerHTML = "";

            providers.forEach(([name, image]) => {

                const card =
                    document.createElement("div");

                card.className = "provider-card";

                if (
                    name.toLowerCase() ===
                    "pop"
                ) {
                    card.classList.add("active");
                }

                card.dataset.provider = name;

                card.innerHTML = `
                    <img
                        src="${image}"
                        alt="${name}"
                    >
                `;

                /*
                 * Untuk sementara provider diarahkan
                 * sesuai nama file provider.
                 *
                 * Nanti saat kita rapikan index.html,
                 * bagian ini yang akan kita ubah.
                 */
                card.addEventListener("click", () => {

                    const fileName =
                        name + " Games.html";

                    window.location.href = fileName;

                });

                providersGrid.appendChild(card);

            });

        }


        /* =========================================================
           RENDER GAMES
        ========================================================== */

        function renderGames() {

            gamesContainer.innerHTML = "";

            games.forEach(game => {

                const card =
                    document.createElement("div");

                card.className = "game-card";

                card.dataset.gameId =
                    game.id;

                const buttonFunction =
    `openPolaModal('${escapeQuotes(game.name)}')`;

                card.innerHTML = `

                    <div class="game-img">

                        <div class="hot-badge">
                            HOT GAME
                        </div>

                        <img
                            src="${game.img}"
                            alt="${game.name}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >

                        <button
                            class="pola-btn"
                            onclick="${buttonFunction}"
                        >
                            POLA
                        </button>

                    </div>

                    <div class="game-info">

                        <div class="game-title-row">

                            <img
                                src="https://img-1-97.rapidflarecdn.net/images/brandProvider/FatPanda/colorful-light.png"
                                class="game-icon"
                                alt="POP"
                            >

                            <div class="game-title">
                                ${game.name}
                            </div>

                        </div>

                        <div
                            class="game-rtp"
                            data-rtp="0"
                        >
                            <span>0%</span>
                        </div>

                    </div>
                `;

                gamesContainer.appendChild(card);

            });

        }


        /* =========================================================
           ESCAPE QUOTE
        ========================================================== */

        function escapeQuotes(text) {

            return text
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /* =========================================================
           SIDEBAR MOBILE
        ========================================================== */

        function toggleSidebar() {

            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");

        }


        /* =========================================================
           RTP SYSTEM
        ========================================================== */

        const RTP_TIMESTAMP_KEY =
            "pop_rtp_timestamp";

        const RTP_DATA_KEY =
            "pop_rtp_game_data";

        const RTP_INTERVAL =
            35 * 60 * 1000;

        const POLA_DATA_KEY =
            "pop_pola_game_data";


        function generateRTP(force = false) {

            const now =
                Date.now();

            let timestamp =
                localStorage.getItem(
                    RTP_TIMESTAMP_KEY
                );

            let data =
                JSON.parse(
                    localStorage.getItem(
                        RTP_DATA_KEY
                    ) || "{}"
                );

            let polaData =
                JSON.parse(
                    localStorage.getItem(
                        POLA_DATA_KEY
                    ) || "{}"
                );


            /*
             * Generate ulang setiap 35 menit
             */

            if (
                force ||
                !timestamp ||
                now - Number(timestamp) >=
                RTP_INTERVAL
            ) {

                timestamp = now;

                data = {};

                const polaData = {};

                games.forEach(game => {

                    const value =
                        Math.floor(
                            Math.random() *
                            (98 - 15 + 1)
                        ) + 15;

                    data[game.id] =
                        value;

                    polaData[game.id] = {
                        stake: getRandomItem(stakeRanges),
                        jam: generateRandomTime(),
                        panaskan: getRandomItem(autoOptions),
                        naikkan: getRandomItem(autoOptions),
                        putaran: getRandomItem(manualOptions),
                        icons1: getRandomIcons(),
                        icons2: getRandomIcons(),
                        icons3: getRandomIcons()
                    };

                });

                localStorage.setItem(
                    RTP_TIMESTAMP_KEY,
                    timestamp
                );

                localStorage.setItem(
                    RTP_DATA_KEY,
                    JSON.stringify(data)
                );

                localStorage.setItem(
                    POLA_DATA_KEY,
                    JSON.stringify(polaData)
                );

            } else if (
                !polaData ||
                Object.keys(polaData).length === 0
            ) {

                /*
                 * Jika RTP lama masih berlaku tetapi pola belum
                 * tersimpan, buat pola sekali tanpa mengubah RTP.
                 */

                polaData = {};

                games.forEach(game => {

                    polaData[game.id] = {
                        stake: getRandomItem(stakeRanges),
                        jam: generateRandomTime(),
                        panaskan: getRandomItem(autoOptions),
                        naikkan: getRandomItem(autoOptions),
                        putaran: getRandomItem(manualOptions),
                        icons1: getRandomIcons(),
                        icons2: getRandomIcons(),
                        icons3: getRandomIcons()
                    };

                });

                localStorage.setItem(
                    POLA_DATA_KEY,
                    JSON.stringify(polaData)
                );

            }


            /*
             * Terapkan RTP ke kartu
             */

            document
                .querySelectorAll(".game-card")
                .forEach(card => {

                    const gameId =
                        card.dataset.gameId;

                    const rtp =
                        data[gameId] || 50;

                    const rtpElement =
                        card.querySelector(
                            ".game-rtp"
                        );

                    const rtpText =
                        rtpElement.querySelector(
                            "span"
                        );


                    rtpText.innerText =
                        rtp + "%";


                    let color;


                    if (rtp <= 35) {

                        color = "#e74c3c";

                    } else if (rtp <= 74) {

                        color = "#f1c40f";

                    } else {

                        color = "#27ae60";

                    }


                    /*
                     * HOT GAME jika RTP >= 75%
                     */

                    if (rtp >= 75) {

                        card.classList.add(
                            "is-hot"
                        );

                    } else {

                        card.classList.remove(
                            "is-hot"
                        );

                    }


                    rtpElement.style.background =
                        `linear-gradient(
                            90deg,
                            ${color} ${rtp}%,
                            #111827 ${rtp}%
                        )`;

                    rtpElement.style.border =
                        `1px solid ${color}`;

                });

        }


        /* =========================================================
           RANDOM DATA POPUP
        ========================================================== */

        const autoOptions = [
            10,
            20,
            25,
            30,
            40,
            50
        ];

        const manualOptions = [
            10,
            15,
            20,
            25,
            30
        ];

        const stakeRanges = [
            "200 - 5.0k",
            "400 - 8.5k",
            "800 - 9.8k",
            "1.000 - 15.0k",
            "200 - 20.0k"
        ];


        function getRandomItem(array) {

            return array[
                Math.floor(
                    Math.random() *
                    array.length
                )
            ];

        }


        function getRandomIcons() {

            const symbols = [

                `
                <span class="check">✔</span>
                <span class="cross">✖</span>
                <span class="check">✔</span>
                `,

                `
                <span class="cross">✖</span>
                <span class="cross">✖</span>
                <span class="check">✔</span>
                `,

                `
                <span class="cross">✖</span>
                <span class="check">✔</span>
                <span class="check">✔</span>
                `,

                `
                <span class="check">✔</span>
                <span class="cross">✖</span>
                <span class="cross">✖</span>
                `,

                `
                <span class="cross">✖</span>
                <span class="cross">✖</span>
                <span class="cross">✖</span>
                `

            ];

            return getRandomItem(symbols);

        }


        /* =========================================================
           RANDOM TIME
        ========================================================== */

        function generateRandomTime() {

            const now =
                new Date();

            const startHour =
                now.getHours();

            const startMinute =
                now.getMinutes();

            const duration =
                15 +
                Math.floor(
                    Math.random() * 30
                );


            let endMinute =
                startMinute + duration;

            let endHour =
                startHour;


            if (endMinute >= 60) {

                endMinute -= 60;

                endHour =
                    (startHour + 1) % 24;

            }


            const format =
                (hour, minute) => {

                    return (
                        String(hour).padStart(2, "0")
                        +
                        ":"
                        +
                        String(minute).padStart(2, "0")
                    );

                };


            return (
                format(
                    startHour,
                    startMinute
                )
                +
                " - "
                +
                format(
                    endHour,
                    endMinute
                )
            );

        }


        /* =========================================================
           OPEN POLA MODAL
        ========================================================== */

        function openPolaModal(gameName) {

            document
                .getElementById("modalGameTitle")
                .innerText =
                gameName.toUpperCase();


            const polaData =
                JSON.parse(
                    localStorage.getItem(
                        POLA_DATA_KEY
                    ) || "{}"
                );

            const game =
                games.find(
                    item =>
                        item.name === gameName
                );

            const pola =
                polaData[
                    game ? game.id : ""
                ] || {
                    stake: getRandomItem(stakeRanges),
                    jam: generateRandomTime(),
                    panaskan: getRandomItem(autoOptions),
                    naikkan: getRandomItem(autoOptions),
                    putaran: getRandomItem(manualOptions),
                    icons1: getRandomIcons(),
                    icons2: getRandomIcons(),
                    icons3: getRandomIcons()
                };


            document
                .getElementById("modalStake")
                .innerText =
                pola.stake;


            document
                .getElementById("modalJam")
                .innerText =
                pola.jam;


            document
                .getElementById("polaSectionTitle")
                .innerText =
                "Pola Gacor";


            document
                .getElementById("modalContentCard")
                .innerHTML = `

                    <div class="step-item">

                        <div class="step-label">
                            Panaskan Mesin !
                        </div>

                        <div class="step-action">
                            ${pola.panaskan}
                            ${pola.icons1}
                            Auto
                        </div>

                    </div>


                    <div class="step-item">

                        <div class="step-label">
                            Naikkan Bet !
                        </div>

                        <div class="step-action">
                            ${pola.naikkan}
                            ${pola.icons2}
                            Auto
                        </div>

                    </div>


                    <div class="step-item">

                        <div class="step-label">
                            Putaran akhir !
                        </div>

                        <div class="step-action">
                            Manual
                            ${pola.putaran}
                            ${pola.icons3}
                        </div>

                    </div>

                `;


            document
                .getElementById("modalFooterNote")
                .innerHTML =
                "Catatan :<br>lakukan pola di atas minimal 2x!";


            document
                .getElementById("polaModal")
                .classList.add("active");

        }

        /* =========================================================
           CLOSE MODAL
        ========================================================== */

        function closePolaModal(event) {

            if (
                event &&
                event.target !==
                document.getElementById("polaModal")
            ) {
                return;
            }

            document
                .getElementById("polaModal")
                .classList.remove("active");

        }


        function forceCloseModal() {

            document
                .getElementById("polaModal")
                .classList.remove("active");

        }


        /* =========================================================
           INIT
        ========================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                renderProviders();

                renderGames();

                generateRTP();

            }
        );

        setInterval(() => {
            generateRTP(true);
        }, RTP_INTERVAL);

    </script>
