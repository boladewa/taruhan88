    <style>
        /* RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* BODY */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #050b14;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MOBILE HEADER */
        .mobile-header-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #071326;
            border-bottom: 1px solid #14284a;
            padding: 0 15px;
            align-items: center;
            justify-content: space-between;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .mobile-menu-btn {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        /* OVERLAY */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background-color: #071326;
            border-right: 1px solid #14284a;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        /* SIDEBAR HEADER */
        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid #14284a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: bold;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        /* PROVIDERS GRID */
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }

        /* SCROLLBAR */
        .providers-grid::-webkit-scrollbar {
            width: 5px;
        }

        .providers-grid::-webkit-scrollbar-track {
            background: #071326;
        }

        .providers-grid::-webkit-scrollbar-thumb {
            background: #1b3866;
            border-radius: 5px;
        }

        /* PROVIDER CARD */
        .provider-card {
            background-color: #0b1a32;
            border: 1px solid #1b3866;
            border-radius: 8px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #ffffff;
            overflow: hidden;
            text-decoration: none;
        }

        /* HOVER */
        .provider-card:hover {
            border-color: #3b82f6;
            background-color: #102547;
        }

        /* PROVIDER IMAGE */
        .provider-card.img-card {
            padding: 0;
            background-color: #112238;
        }

        .provider-card.img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
        }

        /* MAIN CONTENT */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            background-color: #050b14;
            min-width: 0;
            min-height: 100vh;
        }

        .content-box {
            width: 100%;
            min-height: calc(100vh - 50px);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #07101d;
            border: 1px solid #14284a;
            border-radius: 10px;
        }

        .content-message {
            text-align: center;
            padding: 30px;
        }

        .content-message h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .content-message p {
            font-size: 14px;
            color: #94a3b8;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .mobile-header-bar {
                display: flex;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                z-index: 1002;
                width: 300px;
                height: 100vh;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                width: 100%;
                padding: 75px 15px 20px 15px;
                min-height: 100vh;
            }

            .content-box {
                min-height: calc(100vh - 95px);
            }
        }

        /* HP KECIL */
        @media (max-width: 420px) {

            .sidebar {
                width: 300px;
            }

            .mobile-header-bar {
                padding: 0 12px;
            }

            .providers-grid {
                gap: 8px;
                padding: 15px;
            }

            .provider-card {
                height: 45px;
            }
        }
    </style>

    <!-- JAVASCRIPT -->
    <script>

        function toggleSidebar() {

            const sidebar = document.getElementById("sidebarMenu");
            const overlay = document.getElementById("sidebarOverlay");

            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
        }

        /* Tutup sidebar setelah provider dipilih di mobile */

        document
            .querySelectorAll(".provider-card")
            .forEach(function(provider) {

                provider.addEventListener("click", function() {

                    if (window.innerWidth <= 768) {

                        const sidebar =
                            document.getElementById("sidebarMenu");

                        const overlay =
                            document.getElementById("sidebarOverlay");

                        sidebar.classList.remove("active");
                        overlay.classList.remove("active");
                    }

                });

            });

        /* Reset sidebar ketika kembali ke desktop */

        window.addEventListener("resize", function() {

            if (window.innerWidth > 768) {

                const sidebar =
                    document.getElementById("sidebarMenu");

                const overlay =
                    document.getElementById("sidebarOverlay");

                sidebar.classList.remove("active");
                overlay.classList.remove("active");
            }

        });

    </script>
